<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0f766e"/>
  <rect x="72" y="72" width="1056" height="150" rx="20" fill="#ffffff"/>
  <text x="108" y="138" font-family="sans-serif" font-size="34" fill="#6b7280">日本語で入力（例: 睡眠 質 を上げる）</text>
  <rect x="880" y="102" width="212" height="90" rx="14" fill="#0f766e"/>
  <text x="986" y="162" font-family="sans-serif" font-size="40" font-weight="bold" fill="#ffffff" text-anchor="middle">さがす</text>
  <text x="72" y="420" font-family="sans-serif" font-weight="bold" font-size="150" fill="#ffffff">えごさ</text>
  <text x="520" y="372" font-family="sans-serif" font-size="46" fill="#ffffff">日本語で探して、</text>
  <text x="520" y="438" font-family="sans-serif" font-size="46" fill="#ffffff">英語を読む</text>
  <text x="76" y="548" font-family="sans-serif" font-size="34" fill="#ccfbf1">単語をタップすると訳が出て、ふりがなが貯まります</text>
